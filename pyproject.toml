[project]
name = "whisperninja"
version = "0.1.0"
description = "Dictation app"
readme = "README.md"
requires-python = ">=3.10.0,<3.13"
dependencies = [
    "pyaudio==0.2.14",
    "pynput==1.7.6",
    "numpy>=1.24.0",
    "pywhispercpp>=1.2.0",
    "PyQt6>=6.5.0",
    "pygame>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisperninja/"]

[tool.hatch.envs.default]
python = "3.12"