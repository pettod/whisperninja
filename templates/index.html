<!DOCTYPE html>
<html>
<head>
    <title>Twilio Live Call</title>
</head>
<body>
    <h1>Call a Phone Live</h1>
    <input type="text" id="phoneNumber" placeholder="Recipient number +1234567890">
    <button id="callBtn">Call</button>
    <button id="hangupBtn">Hang Up</button>

    <script src="https://media.twiliocdn.com/sdk/js/voice/latest/twilio.min.js"></script>
    <script>
        let device;

        async function initTwilio() {
            const response = await fetch('/token');
            const data = await response.json();
            const token = data.token;

            device = new Twilio.Device(token, { debug: true });

            device.on('ready', () => console.log('Device ready'));
            device.on('error', (err) => console.error(err));
            device.on('connect', () => console.log('Call connected'));
            device.on('disconnect', () => console.log('Call ended'));
        }

        document.getElementById('callBtn').onclick = () => {
            const number = document.getElementById('phoneNumber').value;
            if (!number) return alert("Enter a phone number");
            device.connect({ To: number });
        };

        document.getElementById('hangupBtn').onclick = () => {
            device.disconnectAll();
        };

        initTwilio();
    </script>
</body>
</html>
